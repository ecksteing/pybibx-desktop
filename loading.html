<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading PyBibX…</title>
  <style>
    :root {
      --text: #1f2a37;
      --muted: #5b6b7c;
      --accent: #1f6f8b;
      --track: #e8eef3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: #ffffff;
    }
    .wrap {
      width: min(520px, calc(100vw - 32px));
      text-align: center;
      padding: 24px 12px;
    }
    .loader {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 28px;
      font-weight: bold;
      font-family: monospace;
      font-size: clamp(1.15rem, 4.2vw, 1.85rem);
      line-height: 1.35;
      color: #000000;
    }
    .loader::before {
      content: attr(data-label);
      white-space: pre-wrap;
    }
    .status {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--accent);
      min-height: 1.2em;
      font-weight: 600;
    }
    .detail {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.2em;
      word-break: break-all;
      font-family: Consolas, "Courier New", monospace;
    }
    .bar {
      margin: 18px auto 0;
      height: 8px;
      width: min(360px, 100%);
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
      text-align: left;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 30%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .bar.indeterminate > span {
      width: 35%;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    .pct {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1em;
    }
    @media (prefers-reduced-motion: reduce) {
      .bar.indeterminate > span { animation: none; width: 40%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="loader" id="funLoader" data-label="Loading ..." aria-live="polite"></div>
    <div class="status" id="status">Checking for the app…</div>
    <div class="detail" id="detail"></div>
    <div class="bar indeterminate" id="bar" aria-hidden="true"><span id="barFill"></span></div>
    <div class="pct" id="pct"></div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var target = params.get("target") || "http://127.0.0.1:5173/";
      var mode = params.get("mode") || "start";
      var statusEl = document.getElementById("status");
      var detailEl = document.getElementById("detail");
      var barEl = document.getElementById("bar");
      var barFill = document.getElementById("barFill");
      var pctEl = document.getElementById("pct");
      var funLoader = document.getElementById("funLoader");
      var redirected = false;

      var funLabels = [
        "Loading ...",
        "Still going ...",
        "It takes awhile but it'll be good ...",
        "Getting things ready ...",
        "Hold tight ..."
      ];
      var funIndex = 0;
      funLoader.setAttribute("data-label", funLabels[0]);
      setInterval(function () {
        funIndex = (funIndex + 1) % funLabels.length;
        funLoader.setAttribute("data-label", funLabels[funIndex]);
      }, 20000);

      if (mode === "bootstrap") {
        statusEl.textContent = "Installing packages…";
      } else if (mode === "reopen") {
        statusEl.textContent = "Reopening…";
      } else {
        statusEl.textContent = "Loading libraries…";
      }

      function setProgress(percent) {
        if (typeof percent === "number" && !isNaN(percent) && percent >= 0) {
          var clamped = Math.max(0, Math.min(100, percent));
          barEl.classList.remove("indeterminate");
          barFill.style.width = clamped + "%";
          barFill.style.transform = "none";
          pctEl.textContent = Math.round(clamped) + "%";
        } else {
          barEl.classList.add("indeterminate");
          barFill.style.width = "35%";
          barFill.style.transform = "";
          pctEl.textContent = "";
        }
      }

      function refreshStatus() {
        fetch("/status", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.message) statusEl.textContent = data.message;
            if (data && data.detail) detailEl.textContent = data.detail;
            if (data) setProgress(data.percent);
          })
          .catch(function () {});
      }

      function probe() {
        if (redirected) return;
        fetch("/readyz", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ready) {
              redirected = true;
              statusEl.textContent = "Opening PyBibX…";
              detailEl.textContent = "";
              setProgress(100);
              window.location.replace(target);
              return;
            }
            setTimeout(probe, 700);
          })
          .catch(function () { setTimeout(probe, 900); });
      }

      refreshStatus();
      setInterval(refreshStatus, 600);
      probe();
    })();
  </script>
</body>
</html>
